<section id="portfolio" class="portfolio section light-background">
  <div class="container section-title" data-aos="fade-up">
    <h2>Portafolio</h2>
    <p>{{ projects().description }}</p>
  </div>
  <div class="container">
    <div class="isotope-layout" data-default-filter="*" data-layout="masonry">
      <ul class="portfolio-filters isotope-filters" data-aos="fade-up" data-aos-delay="100">
        <li [class.filter-active]="filter() === '*'">
          <button
            type="button"
            (click)="select('*')"
            [disabled]="!ready()"
            [attr.aria-pressed]="filter() === '*'"
          >
            Todos
          </button>
        </li>
        @for (category of projects().categories; track category.id) {
          <li [class.filter-active]="filter() === '.filter-' + category.id">
            <button
              type="button"
              (click)="select('.filter-' + category.id)"
              [disabled]="!ready()"
              [attr.aria-pressed]="filter() === '.filter-' + category.id"
            >
              {{ category.label }}
            </button>
          </li>
        }
      </ul>
      <div class="row gy-4 isotope-container" data-aos="fade-up" data-aos-delay="200">
        @for (project of projects().items; track project.id) {
          <div [class]="'col-lg-4 col-md-6 portfolio-item isotope-item filter-' + project.category">
            <div class="portfolio-content h-100">
              <img
                [src]="project.image"
                class="img-fluid"
                [alt]="project.title + ': concepto académico ficticio'"
                width="1200"
                height="800"
                loading="lazy"
              />
              <div class="portfolio-info">
                <h4>{{ project.title }}</h4>
                <p>{{ project.description }}</p>
                <a
                  [href]="project.image"
                  [attr.data-title]="project.title + ' (ficticio)'"
                  data-gallery="portfolio-gallery"
                  class="portfolio-lightbox glightbox preview-link" (click)="open($event, $index)"
                  [attr.aria-label]="'Ampliar ' + project.title"
                  ><i class="bi bi-zoom-in" aria-hidden="true"></i></a
                ><a
                  [routerLink]="['/portfolio', project.id]"
                  class="details-link"
                  [attr.aria-label]="'Ver detalles de ' + project.title"
                  ><i class="bi bi-link-45deg" aria-hidden="true"></i
                ></a>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
