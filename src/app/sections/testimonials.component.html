<section id="testimonials" class="testimonials section light-background">
  <div class="container section-title" data-aos="fade-up">
    <h2>Testimonios</h2>
    <p>{{ testimonials().description }}</p>
  </div>
  <div class="container" data-aos="fade-up" data-aos-delay="100">
    <div class="swiper init-swiper" aria-label="Testimonios ficticios">
      <div class="swiper-wrapper">
        @for (item of testimonials().items; track item.id) {
          <div class="swiper-slide">
            <div class="testimonial-item">
              <p>
                <i class="bi bi-quote quote-icon-left" aria-hidden="true"></i
                ><span>{{ item.quote }}</span
                ><i class="bi bi-quote quote-icon-right" aria-hidden="true"></i>
              </p>
              <img
                [src]="item.image"
                class="testimonial-img"
                alt="Avatar genérico de persona ficticia"
                width="300"
                height="300"
                loading="lazy"
              />
              <h3>{{ item.name }}</h3>
              <h4>{{ item.role }}</h4>
            </div>
          </div>
        }
      </div>
      <div class="swiper-pagination"></div>
    </div>
  </div>
</section>
